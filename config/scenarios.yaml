Base_growth_limited_6h01:
  sector:
    limit_max_growth:
      enable: true
      # allowing 30% larger than max historic growth
    factor: 1
    max_growth:  # unit GW
      onwind: 1 # onshore max grow so far 16 GW in Europe https://www.iea.org/reports/renewables-2020/wind
      solar: 66 # solar max grow so far 66 GW in Europe 2024
      offwind-ac: 35 # offshore max grow so far 3.5 GW in Europe https://windeurope.org/about-wind/statistics/offshore/european-offshore-wind-industry-key-trends-statistics-2019/
      offwind-dc: 35
    max_relative_growth:
      onwind: 0.1
      solar: 3
      offwind-ac: 3
      offwind-dc: 3

