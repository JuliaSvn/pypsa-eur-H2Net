# This file is used to define the scenarios that are run by snakemake. Each entry on the first level is a scenario. Each scenario can contain configuration overrides with respect to the config/config.yaml settings.
#
# Example
#
# custom-scenario: # name of the scenario
#   electricity:
#       renewable_carriers: [wind, solar] # override the list of renewable carriers

Base:
  sector:
    H2_retrofit: true
  
Base_no_retrofit:
  sector:
    H2_retrofit: false

Base_cost_electrolysis-:
  costs:
    overwrites: {FOM: {offwind: 1.39}, lifetime: {offwind-float: 30}, investment:{electrolysis: 500000}}

Base_cost_onwind+20:
  costs:
    overwrites: {FOM: {offwind: 1.39}, lifetime: {offwind-float: 30}, investment:{onwind: 1222965}}

Base_aviation-90:
  sector:
      aviation_demand_factor: 0.1

Base_import:
  sector:
    imports:
      enable: true
      limit: .inf
      limit_sense: <=
      price:
        H2: 74
        NH3: 97
        methanol: 121
        gas: 122
        oil: 125


Base_TYNDP_2050:
  solving:
    agg_p_nom_limits:
      file: data/agg_p_nom_minmax_TYNDP_2050.csv


Base_cost_solar-20:
  costs:
    overwrites: {FOM: {offwind: 1.39}, lifetime: {offwind-float: 30}, investment:{solar: 326974, solar-rooftop: 419886, solar-rooftop commercial: 331121, solar-rooftop residential: 508651, solar-utility: 234062, solar-utility single-axis tracking: 282010 }}


Base_biomass_high:
